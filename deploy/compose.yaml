# Déploiement d'Hermès : base PostgreSQL, API, front (nginx) et sauvegardes quotidiennes.
# Les variables viennent de deploy/.env (voir .env.example).
name: hermes

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ..
    image: hermes-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hermes
      SPRING_DATASOURCE_USERNAME: hermes
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      # Les opérations récurrentes sont générées à 1 h, heure locale
      TZ: ${TZ:-Europe/Paris}

  app:
    build: ${HERMES_APP_DIR:-../../hermes-app}
    image: hermes-app
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HERMES_PORT:-8090}:80"

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: hermes
      PGUSER: hermes
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/backup.sh", "--daemon"]

volumes:
  db-data:
