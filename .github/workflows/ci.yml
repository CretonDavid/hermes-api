# Intégration continue : compilation (avertissements javac), tests et couverture à chaque push et PR
name: CI

on:
  push:
    branches: [master, develop, "feature/**", "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Compilation, tests et couverture
        run: ./mvnw -B verify

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco
          path: target/site/jacoco
