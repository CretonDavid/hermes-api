spring.application.name=hermes-api

# Base de données : identifiants fournis par l'environnement, jamais versionnés
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hermes-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.format.date=iso
spring.jackson.deserialization.fail-on-null-for-primitives=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Derrière nginx : l'adresse du client vient de X-Forwarded-For (proxys internes uniquement)
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=never

# Seul l'état de santé est exposé, sans détail
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.issuer=hermes-api
application.security.jwt.access-token-ttl=15m
application.security.jwt.refresh-token-ttl=7d

# Limitation des tentatives sur les routes publiques, par adresse IP
application.security.rate-limit.login-per-minute=10
application.security.rate-limit.register-per-hour=5
application.security.rate-limit.refresh-per-minute=30

application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Taux de change BCE (service public, sans clé)
application.exchange-rates.provider-url=https://api.frankfurter.dev/v1
# Génération des opérations récurrentes : tous les jours à 1 h du matin
application.recurring.cron=0 0 1 * * *
