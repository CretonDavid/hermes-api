# Une base par contexte Spring : deux contextes ne partagent jamais un schéma recréé (create-drop)
spring.datasource.url=jdbc:h2:mem:hermes-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.mvc.format.date=iso
spring.jackson.deserialization.fail-on-null-for-primitives=false

application.security.jwt.secret=dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtMTIzNDU2Nzg=
application.security.jwt.issuer=hermes-api
application.security.jwt.access-token-ttl=15m
application.security.jwt.refresh-token-ttl=7d
application.security.jwt.reuse-grace=0s

application.cors.allowed-origins=http://localhost:4200
application.exchange-rates.provider-url=http://localhost:0
application.recurring.cron=-

# Les tests créent de nombreux comptes depuis la même adresse
application.security.rate-limit.login-per-minute=10000
application.security.rate-limit.register-per-hour=10000
application.security.rate-limit.refresh-per-minute=10000
